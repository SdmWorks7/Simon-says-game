<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>SIMON SAYS GAME</h1>
    <h2>Press any key to start the Game</h2>

        <span class="maxScore"></span>
    <div class="btn-container">
        <div class="container">
            <div class="btn one" id="one" type="button"></div>
            <div class="btn two" id="two" type="button"></div>
        </div>
        <div class="container">
            <div class="btn three" id="three" type="button"></div>
            <div class="btn four" id="four" type="button"></div>
        </div>
    </div>


    <div class="reset-btn" type="button" onclick="resetBtn()">RESET</div>

    <script src="script.js"></script>
</body>
</html>
